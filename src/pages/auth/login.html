<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/features/auth/auth.css">
    <!-- Thư viện icon Lucide -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="auth-page">
        <button
            id="language-button"
            class="language-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="language-menu">
            <img
                class="language-button__icon"
                src="/src/assets/pages/login/dia_cau_language.svg"
                alt="">
            <span class="language-button__text">
                Tiếng Việt
            </span>
            <img
                class="language-button__arrow"
                src="/src/assets/pages/login/mui_ten_drop.svg"
                alt="">
        </button>
        <!-- Banner full-page + caption/pagination neo theo banner -->
        <div class="auth-banner">
            <img
                class="auth-banner__image"
                src="/src/assets/pages/login/auth_banner.svg"
                alt="Welcome to Peak">
            <div class="auth-banner__caption">
                <h1 class="auth-banner__title">
                    Hệ thống quản lý chat đa nền tảng
                </h1>
                <p class="auth-banner__description">
                    Tiết kiệm thời gian tư vấn và chăm sóc khách hàng
                </p>
            </div>
            <nav class="auth-banner__pagination">
                <span class="auth-banner__dot auth-banner__dot--active"></span>
                <span class="auth-banner__dot"></span>
                <span class="auth-banner__dot"></span>
            </nav>
        </div>

        <section class="auth-page__left">
        </section>
        <section class="auth-page__right">
            <div class="auth-card">
                <header class="auth-card__header">
                    <img
                        class="auth-card__logo"
                        src="/src/assets/pages/login/vss_logo.svg"
                        alt="VSS Logo">
                    <h2 class="auth-card__title">
                        Đăng nhập vào tài khoản của bạn
                    </h2>
                </header>
                <div class="auth-card__body">
                    <form class="login-form" novalidate>
                        <div class="login-form__field">
                            <input type="text" id="username" class="login-form__input" placeholder=" " required>
                            <label for="username" class="login-form__label" data-default="Nhập tài khoản" data-active="Tài khoản"></label>
                        </div>
                        <div class="login-form__field">
                            <input type="password" id="password" class="login-form__input" placeholder=" " required>
                            <label for="password" class="login-form__label" data-default="Nhập mật khẩu" data-active="Mật khẩu"></label>
                            <button type="button" class="login-form__password-toggle" aria-label="Hiện mật khẩu"><i data-lucide="eye"></i></button>
                        </div>
                        <div class="login-form__options">
                            <label class="login-form__remember-me">
                                <input type="checkbox" id="remember-me" name="remember-me" class="login-form__checkbox">
                                <span class="login-form__checkmark"></span>
                                <span class="login-form__remember-text">Lưu mật khẩu</span>
                            </label>
                            <a href="/src/pages/auth/forgot-password.html" class="login-form__forgot-password">Quên mật khẩu?</a>
                        </div>
                        <button type="submit" class="login-form__submit">Đăng nhập</button>
                    </form>
                </div>
                <footer class="auth-card__footer">
                    <span>Bạn chưa có tài khoản?</span>
                    <a href="/src/pages/auth/register.html" class="auth-card__footer-link">Đăng ký</a>
                </footer>
            </div>
        </section>
    </main>
    <script>lucide.createIcons();</script>
    <script type="module" src="/src/scripts/troll/genius.js"></script>
    <script type="module" src="/src/scripts/auth/passwordToggle.js"></script>
    <script type="module" src="/src/scripts/auth/authChecking.js"></script>
</body>

</html>
