<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký trải nghiệm - VSS Chatplatform</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/features/auth/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="auth-page">
        <button
            id="language-button"
            class="language-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="language-menu">
            <img
                class="language-button__icon"
                src="/src/assets/pages/login/dia_cau_language.svg"
                alt="">
            <span class="language-button__text">
                Tiếng Việt
            </span>
            <img
                class="language-button__arrow"
                src="/src/assets/pages/login/mui_ten_drop.svg"
                alt="">
        </button>

        <div class="auth-banner">
            <img
                class="auth-banner__image"
                src="/src/assets/pages/login/auth_banner.svg"
                alt="Welcome to Peak">
            <div class="auth-banner__caption">
                <h1 class="auth-banner__title">
                    Hệ thống quản lý chat đa nền tảng
                </h1>
                <p class="auth-banner__description">
                    Tiết kiệm thời gian tư vấn và chăm sóc khách hàng
                </p>
            </div>
            <nav class="auth-banner__pagination">
                <span class="auth-banner__dot auth-banner__dot--active"></span>
                <span class="auth-banner__dot"></span>
                <span class="auth-banner__dot"></span>
            </nav>
        </div>

        <section class="auth-page__left">
        </section>

        <section class="auth-page__right">
            <div class="auth-card">
                <header class="auth-card__header">
                    <img
                        class="auth-card__logo"
                        src="/src/assets/pages/login/vss_logo.svg"
                        alt="VSS Logo">
                    <h2 class="auth-card__title">
                        Đăng ký trải nghiệm
                    </h2>
                </header>

                <div class="auth-card__body">
                    <form class="register-form" novalidate>
                        <!-- Họ và Tên -->
                        <div class="register-form__row">
                            <div class="register-form__field register-form__field--half">
                                <input type="text" id="lastName" class="register-form__input" placeholder=" " required>
                                <label for="lastName" class="register-form__label" data-default="Nhập họ của bạn" data-active="Họ"></label>
                            </div>
                            <div class="register-form__field register-form__field--half">
                                <input type="text" id="firstName" class="register-form__input" placeholder=" " required>
                                <label for="firstName" class="register-form__label" data-default="Nhập tên của bạn" data-active="Tên"></label>
                            </div>
                        </div>

                        <!-- Email làm việc -->
                        <div class="register-form__field">
                            <input type="email" id="workEmail" class="register-form__input" placeholder=" " required>
                            <label for="workEmail" class="register-form__label" data-default="Nhập email làm việc" data-active="Email làm việc"></label>
                        </div>

                        <!-- Tên công ty & Quốc gia -->
                        <div class="register-form__row">
                            <div class="register-form__field register-form__field--half">
                                <input type="text" id="companyName" class="register-form__input" placeholder=" " required>
                                <label for="companyName" class="register-form__label" data-default="Nhập tên công ty" data-active="Tên công ty"></label>
                            </div>
                            <div class="register-form__field register-form__field--half">
                                <select id="country" class="register-form__select" required>
                                    <option value="" disabled selected hidden></option>
                                    <option value="VN">Việt Nam</option>
                                    <option value="US">Hoa Kỳ</option>
                                    <option value="JP">Nhật Bản</option>
                                    <option value="KR">Hàn Quốc</option>
                                    <option value="SG">Singapore</option>
                                </select>
                                <label for="country" class="register-form__label" data-default="Quốc gia" data-active="Quốc gia"></label>
                                <i data-lucide="chevron-down" class="register-form__select-arrow"></i>
                            </div>
                        </div>

                        <!-- Lĩnh vực -->
                        <div class="register-form__field">
                            <select id="industry" class="register-form__select" required>
                                <option value="" disabled selected hidden></option>
                                <option value="IT">Công nghệ thông tin / Phần mềm</option>
                                <option value="EC">Thương mại điện tử / Bán lẻ</option>
                                <option value="BF">Tài chính / Ngân hàng / Bảo hiểm</option>
                                <option value="EDU">Giáo dục / Đào tạo</option>
                                <option value="MKT">Truyền thông / Marketing</option>
                                <option value="OTHER">Lĩnh vực khác</option>
                            </select>
                            <label for="industry" class="register-form__label" data-default="Nhập lĩnh vực" data-active="Lĩnh vực"></label>
                            <i data-lucide="chevron-down" class="register-form__select-arrow"></i>
                        </div>

                        <!-- Vị trí làm việc -->
                        <div class="register-form__field">
                            <input type="text" id="jobTitle" class="register-form__input" placeholder=" " required>
                            <label for="jobTitle" class="register-form__label" data-default="Vị trí làm việc" data-active="Vị trí làm việc"></label>
                        </div>

                        <!-- Mục đích bạn đến với website -->
                        <div class="register-form__field">
                            <input type="text" id="purpose" class="register-form__input" placeholder=" ">
                            <label for="purpose" class="register-form__label" data-default="Mục đích bạn đến với website" data-active="Mục đích"></label>
                        </div>

                        <button type="submit" class="register-form__submit">Đăng ký</button>
                    </form>
                </div>

                <footer class="auth-card__footer">
                    <span>Bạn đã có tài khoản?</span>
                    <a href="/src/pages/auth/login.html" class="auth-card__footer-link">Đăng nhập</a>
                </footer>
            </div>
        </section>
    </main>

    <script>lucide.createIcons();</script>
    <script type="module" src="/src/scripts/troll/genius.js"></script>
    <script type="module" src="/src/scripts/auth/registerChecking.js"></script>
</body>
</html>
