<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập lần đầu - VSS Chatplatform</title>
    <link rel="stylesheet" href="/src/styles/main.css">
    <link rel="stylesheet" href="/src/styles/features/auth/auth.css">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
    <main class="auth-page">
        <button
            id="language-button"
            class="language-button"
            type="button"
            aria-haspopup="listbox"
            aria-expanded="false"
            aria-controls="language-menu">
            <img
                class="language-button__icon"
                src="/src/assets/pages/login/dia_cau_language.svg"
                alt="">
            <span class="language-button__text">
                Tiếng Việt
            </span>
            <img
                class="language-button__arrow"
                src="/src/assets/pages/login/mui_ten_drop.svg"
                alt="">
        </button>

        <div class="auth-banner">
            <img
                class="auth-banner__image"
                src="/src/assets/pages/login/auth_banner.svg"
                alt="Welcome to Peak">
            <div class="auth-banner__caption">
                <h1 class="auth-banner__title">
                    Hệ thống quản lý chat đa nền tảng
                </h1>
                <p class="auth-banner__description">
                    Tiết kiệm thời gian tư vấn và chăm sóc khách hàng
                </p>
            </div>
            <nav class="auth-banner__pagination">
                <span class="auth-banner__dot auth-banner__dot--active"></span>
                <span class="auth-banner__dot"></span>
                <span class="auth-banner__dot"></span>
            </nav>
        </div>

        <section class="auth-page__left">
        </section>

        <section class="auth-page__right">
            <div class="auth-subcard">
                <header class="auth-subcard__header">
                    <a href="/src/pages/auth/login.html" class="auth-subcard__back" aria-label="Quay lại trang đăng nhập">
                        <i data-lucide="chevron-left"></i>
                        <span>Quay lại</span>
                    </a>
                    <h1 class="auth-subcard__header-title">Đổi mật khẩu</h1>
                </header>

                <div class="auth-subcard__body">
                    <div class="auth-subcard__illustration-container">
                        <img
                            class="auth-subcard__illustration"
                            src="/src/assets/pages/change-password/change_password.svg"
                            alt="Minh họa Đổi mật khẩu lần đầu">
                    </div>

                    <h2 class="auth-subcard__title">Đăng nhập lần đầu</h2>
                    <p class="auth-subcard__description">
                        Đây là lần đầu tiên đăng nhập của bạn, bước đầu tiên bạn cần đổi mật khẩu để đảm bảo tính bảo mật cho tài khoản
                    </p>

                    <form class="auth-subform" novalidate>
                        <div class="auth-subform__field">
                            <input
                                type="password"
                                id="new-password"
                                class="auth-subform__input"
                                placeholder=" "
                                required>
                            <label
                                for="new-password"
                                class="auth-subform__label"
                                data-default="Nhập mật khẩu mới"
                                data-active="Mật khẩu mới">
                            </label>
                            <button type="button" class="auth-subform__password-toggle" data-target="new-password" aria-label="Hiện mật khẩu">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>

                        <div class="auth-subform__field">
                            <input
                                type="password"
                                id="confirm-password"
                                class="auth-subform__input"
                                placeholder=" "
                                required>
                            <label
                                for="confirm-password"
                                class="auth-subform__label"
                                data-default="Nhập lại mật khẩu mới"
                                data-active="Nhập lại mật khẩu mới">
                            </label>
                            <button type="button" class="auth-subform__password-toggle" data-target="confirm-password" aria-label="Hiện mật khẩu">
                                <i data-lucide="eye"></i>
                            </button>
                        </div>

                        <button type="submit" class="auth-subform__submit" disabled>
                            Tiếp tục
                        </button>
                    </form>
                </div>
            </div>
        </section>
    </main>

    <script>lucide.createIcons();</script>
    <script type="module" src="/src/scripts/troll/genius.js"></script>
    <script type="module" src="/src/scripts/auth/firstLogin.js"></script>
</body>
</html>
