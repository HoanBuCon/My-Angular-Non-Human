<div class="create-app-layout">
  <!-- 1. LEFT STEPPER COLUMN -->
  <aside class="create-app-stepper">
    <div class="create-stepper-header">
      <button type="button" class="stepper-back-btn" (click)="goBackToList()" title="Quay lại danh sách" aria-label="Quay lại danh sách">
        <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="10"/>
          <polyline points="13 8 9 12 13 16"/>
        </svg>
      </button>
      <h2 class="stepper-header-title">Thêm ứng dụng</h2>
    </div>

    <div class="stepper-timeline">
      <!-- Step 1: Tạo thông tin ứng dụng -->
      <div
        class="stepper-node"
        (click)="setStep(1)"
        [class.stepper-node--active]="currentStep === 1"
        [class.stepper-node--completed]="currentStep > 1"
        role="button"
        tabindex="0"
      >
        <div class="stepper-icon-circle" [class.stepper-icon-circle--active]="currentStep >= 1">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <polygon points="12 2 2 7 12 12 22 7 12 2"/>
            <polyline points="2 17 12 22 22 17"/>
            <polyline points="2 12 12 17 22 12"/>
          </svg>
        </div>
        <div class="stepper-label">
          <span class="stepper-label-text" [class.stepper-label-text--active]="currentStep >= 1">Tạo thông tin ứng dụng</span>
        </div>
      </div>

      <div class="stepper-connector-line" [class.stepper-connector-line--active]="currentStep >= 2"></div>

      <!-- Step 2: Thêm người sử dụng -->
      <div
        class="stepper-node"
        (click)="setStep(2)"
        [class.stepper-node--active]="currentStep === 2"
        [class.stepper-node--completed]="currentStep > 2"
        role="button"
        tabindex="0"
      >
        <div class="stepper-icon-circle" [class.stepper-icon-circle--active]="currentStep >= 2">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
        </div>
        <div class="stepper-label">
          <span class="stepper-label-text" [class.stepper-label-text--active]="currentStep >= 2">Thêm người sử dụng</span>
        </div>
      </div>

      <div class="stepper-connector-line" [class.stepper-connector-line--active]="currentStep >= 3"></div>

      <!-- Step 3: Hoàn thành -->
      <div
        class="stepper-node"
        (click)="setStep(3)"
        [class.stepper-node--active]="currentStep === 3"
        [class.stepper-node--completed]="currentStep === 3"
        role="button"
        tabindex="0"
      >
        <div class="stepper-icon-circle" [class.stepper-icon-circle--active]="currentStep === 3">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <polyline points="20 6 9 17 4 12"/>
          </svg>
        </div>
        <div class="stepper-label">
          <span class="stepper-label-text" [class.stepper-label-text--active]="currentStep === 3">Hoàn thành</span>
        </div>
      </div>
    </div>
  </aside>

  <!-- 2. RIGHT FORM CONTAINER -->
  <section class="create-app-main">
    <!-- STEP 1: Tạo thông tin ứng dụng -->
    <ng-container *ngIf="currentStep === 1">
      <h1 class="create-app-title">Tạo thông tin ứng dụng</h1>

      <form [formGroup]="createForm" (ngSubmit)="nextStep()" class="create-app-form">
        <div class="create-form-row">
          <!-- Tên ứng dụng -->
          <div class="form-field-group">
            <label class="field-label" for="wizard-app-name">
              Tên ứng dụng <span class="required">*</span>
            </label>
            <div class="field-input-box">
              <div class="field-lead-icon">
                <img src="/assets/pages/app-list/data_icon.svg" width="20" height="20" alt="Tên ứng dụng">
              </div>
              <div class="field-divider"></div>
              <input
                id="wizard-app-name"
                type="text"
                formControlName="name"
                class="field-input"
                placeholder="Nhập tên ứng dụng"
              >
            </div>
          </div>

          <!-- Lĩnh vực -->
          <div class="form-field-group">
            <label class="field-label" for="wizard-app-category">
              Lĩnh vực <span class="required">*</span>
            </label>
            <div class="field-input-box field-select-box">
              <div class="field-lead-icon">
                <img src="/assets/pages/app-list/teacher.svg" width="20" height="20" alt="Lĩnh vực">
              </div>
              <div class="field-divider"></div>
              <select
                id="wizard-app-category"
                formControlName="category"
                class="field-select"
                [class.field-select--placeholder]="!createForm.get('category')?.value"
              >
                <option value="" disabled selected>Chọn lĩnh vực</option>
                <option *ngFor="let cat of categoryList" [value]="cat">{{ cat }}</option>
              </select>
              <div class="field-trail-arrow">
                <svg width="10" height="7" viewBox="0 0 10 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 1.5L5 5.5L9 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>
        </div>

        <!-- Row 2: Mô tả -->
        <div class="create-form-row">
          <div class="form-field-group form-field-group--full">
            <label class="field-label" for="wizard-app-desc">
              Mô tả
            </label>
            <textarea
              id="wizard-app-desc"
              formControlName="description"
              rows="4"
              class="field-textarea"
              placeholder="Nhập mô tả ứng dụng"
            ></textarea>
          </div>
        </div>

        <!-- Row 3: Action Buttons -->
        <div class="create-form-actions">
          <button type="button" class="btn btn--outline-red btn--form-action" (click)="goBackToList()">
            Hủy bỏ
          </button>
          <button
            type="submit"
            class="btn btn--solid-pink btn--form-action"
            [disabled]="!createForm.get('category')?.value"
          >
            Tiếp tục
          </button>
        </div>
      </form>
    </ng-container>

    <!-- STEP 2: Thêm người sử dụng -->
    <ng-container *ngIf="currentStep === 2">
      <h1 class="create-app-title">Thêm người sử dụng</h1>

      <!-- Search & Add User Box -->
      <div class="assign-search-card">
        <div class="assign-search-grid">
          <!-- Search by email -->
          <div class="assign-field-group assign-field-group--search">
            <label class="assign-label">Tìm kiếm nhân viên bằng email</label>
            <div class="assign-input-box">
              <div class="assign-avatar-circle">
                <svg width="22" height="22" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <circle cx="12" cy="8" r="4" fill="currentColor"/>
                  <path d="M4 20C4 16.6863 7.58172 14 12 14C16.4183 14 20 16.6863 20 20" fill="currentColor"/>
                </svg>
              </div>
              <input
                type="text"
                class="assign-input"
                placeholder="Nhấn vào đây để bắt đầu tìm kiếm nhân viên"
                [(ngModel)]="searchUserEmail"
                (keyup.enter)="addUserToApp()"
              />
            </div>
          </div>

          <!-- Role select -->
          <div class="assign-field-group assign-field-group--role">
            <label class="assign-label">Quyền hạn nhân viên</label>
            <div class="assign-select-box">
              <select
                class="assign-select"
                [(ngModel)]="selectedUserRole"
                [class.assign-select--placeholder]="!selectedUserRole"
              >
                <option value="" disabled selected>Chọn quyền hạn</option>
                <option *ngFor="let role of roleList" [value]="role">{{ role }}</option>
              </select>
              <div class="assign-select-arrow">
                <svg width="10" height="7" viewBox="0 0 10 7" fill="none" xmlns="http://www.w3.org/2000/svg">
                  <path d="M1 1.5L5 5.5L9 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </div>
            </div>
          </div>

          <!-- Add button -->
          <div class="assign-btn-col">
            <button
              type="button"
              class="assign-add-btn"
              [class.assign-add-btn--active]="!!searchUserEmail && !!selectedUserRole"
              [disabled]="!searchUserEmail || !selectedUserRole"
              (click)="addUserToApp()"
            >
              Thêm
            </button>
          </div>
        </div>
      </div>

      <!-- Assigned Users Table -->
      <section class="app-table-wrapper assign-table-wrapper">
        <div class="table-responsive">
          <table class="app-table">
            <thead>
              <tr class="table-title-row">
                <th class="col-stt text-center">STT</th>
                <th class="col-name">Tên</th>
                <th class="col-email">Email</th>
                <th class="col-role">Quyền hạn</th>
                <th class="col-actions text-center"></th>
              </tr>

              <tr class="table-filter-row">
                <!-- 1. STT Sort -->
                <th class="col-stt text-center">
                  <button type="button" class="btn-sort" (click)="toggleAssignSort()" title="Sắp xếp theo STT" aria-label="Sắp xếp theo STT">
                    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                      <path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/>
                    </svg>
                  </button>
                </th>

                <!-- 2. Tên Search -->
                <th class="col-name">
                  <div class="filter-box">
                    <div class="input-with-icon">
                      <svg class="filter-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                      </svg>
                      <input
                        type="text"
                        [(ngModel)]="assignNameFilter"
                        placeholder="Tìm kiếm"
                        class="filter-input"
                        aria-label="Tìm kiếm theo tên nhân viên"
                      >
                    </div>
                    <button type="button" class="btn-sort" (click)="toggleAssignSort()" title="Sắp xếp theo Tên" aria-label="Sắp xếp theo Tên">
                      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M7 15l5 5 5-5"/><path d="M7 9l5-5 5 5"/>
                      </svg>
                    </button>
                  </div>
                </th>

                <!-- 3. Email Search -->
                <th class="col-email">
                  <div class="filter-box">
                    <div class="input-with-icon">
                      <svg class="filter-search-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/>
                      </svg>
                      <input
                        type="text"
                        [(ngModel)]="assignEmailFilter"
                        placeholder="Tìm kiếm"
                        class="filter-input"
                        aria-label="Tìm kiếm theo email nhân viên"
                      >
                    </div>
                  </div>
                </th>

                <!-- 4. Quyền hạn Filter -->
                <th class="col-role">
                  <div class="filter-box">
                    <div class="select-with-icon">
                      <select
                        [(ngModel)]="assignRoleFilter"
                        class="filter-select filter-select--plain"
                        aria-label="Lọc theo quyền hạn"
                      >
                        <option value="all">Toàn bộ</option>
                        <option value="Quản trị viên">Quản trị viên</option>
                        <option value="Tư vấn viên">Tư vấn viên</option>
                        <option value="Nhân viên">Nhân viên</option>
                      </select>
                    </div>
                  </div>
                </th>

                <!-- 5. Actions Header -->
                <th class="col-actions"></th>
              </tr>
            </thead>

            <tbody>
              <tr *ngFor="let user of filteredAssignedUsers" class="table-row">
                <td class="col-stt text-center">{{ user.id }}</td>
                <td class="col-name">{{ user.name }}</td>
                <td class="col-email">{{ user.email }}</td>
                <td class="col-role">
                  <span
                    class="assign-role-badge"
                    [class.assign-role-badge--admin]="user.role === 'Quản trị viên'"
                    [class.assign-role-badge--consultant]="user.role === 'Tư vấn viên'"
                    [class.assign-role-badge--staff]="user.role === 'Nhân viên'"
                  >
                    {{ user.role }}
                  </span>
                </td>
                <td class="col-actions text-center">
                  <app-table-actions
                    [showEdit]="false"
                    [showLock]="false"
                    [showDelete]="true"
                    deleteTooltip="Xóa nhân viên khỏi ứng dụng"
                    (delete)="removeAssignedUser(user.id)"
                  ></app-table-actions>
                </td>
              </tr>

              <tr *ngIf="filteredAssignedUsers.length === 0">
                <td colspan="5" class="empty-state">
                  Chưa có nhân viên nào trong danh sách
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </section>

      <!-- Step 2 Action Buttons -->
      <div class="create-form-actions">
        <button type="button" class="btn btn--outline-red btn--form-action" (click)="prevStep()">
          Quay lại
        </button>
        <button type="button" class="btn btn--solid-red btn--form-action" (click)="saveCreateApp()">
          Hoàn thành
        </button>
      </div>
    </ng-container>

    <!-- Watermark Graphic -->
    <div class="create-app-watermark" aria-hidden="true">
      <img src="/assets/pages/app-list/add_app.svg" alt="" class="create-app-watermark-img">
    </div>
  </section>
</div>
