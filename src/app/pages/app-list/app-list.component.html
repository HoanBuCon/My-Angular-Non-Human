<div class="app-layout">
  <!-- 1. Narrow Left Navigation Rail -->
  <nav class="app-rail">
    <div class="app-rail__top">
      <div class="rail-logo">
        <img src="/assets/pages/login/vss_logo.svg" alt="VSS Logo" class="rail-logo__img">
      </div>

      <!-- Item 1: Messages -->
      <a class="rail-item" title="Tin nhắn">
        <img src="/assets/pages/app-list/messages-2.svg" alt="Tin nhắn">
      </a>
      <!-- Item 2: Users Group -->
      <a class="rail-item" title="Người dùng">
        <img src="/assets/pages/app-list/profile-2user.svg" alt="Người dùng">
      </a>
      <!-- Item 3: Active App -->
      <div class="rail-item-active-wrapper">
        <a class="rail-item rail-item--active" title="Ứng dụng">
          <img src="/assets/pages/app-list/hierarchy-square-2.svg" alt="Ứng dụng" class="rail-item__icon-white">
        </a>
      </div>
      <!-- Item 4: Octagon User -->
      <a class="rail-item" title="Quản trị">
        <img src="/assets/pages/app-list/user-octagon.svg" alt="Quản trị">
      </a>
      <!-- Item 5: Driver Database -->
      <a class="rail-item" title="Dữ liệu">
        <img src="/assets/pages/app-list/driver.svg" alt="Dữ liệu">
      </a>
      <!-- Item 6: Link Circle -->
      <a class="rail-item" title="Liên kết">
        <img src="/assets/pages/app-list/link-circle.svg" alt="Liên kết">
      </a>
      <!-- Item 7: Presentation Chart -->
      <a class="rail-item" title="Thống kê">
        <img src="/assets/pages/app-list/presention-chart.svg" alt="Thống kê">
      </a>
      <!-- Item 8: Teacher / Learning -->
      <a class="rail-item" title="Đào tạo">
        <img src="/assets/pages/app-list/teacher.svg" alt="Đào tạo">
      </a>
      <!-- Item 9: Chart Analytics -->
      <a class="rail-item" title="Báo cáo">
        <img src="/assets/pages/app-list/chart.svg" alt="Báo cáo">
      </a>
      <!-- Item 10: Settings -->
      <a class="rail-item" title="Cài đặt">
        <img src="/assets/pages/app-list/setting-2.svg" alt="Cài đặt">
      </a>
    </div>

    <div class="app-rail__bottom">
      <button type="button" class="rail-collapse-btn" (click)="toggleSidebar()" title="Thu gọn / Mở rộng" aria-label="Thu gọn / Mở rộng">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="9 18 15 12 9 6"/></svg>
      </button>
    </div>
  </nav>

  <!-- 2. Right Area: Topbar on TOP, Submenu + Main Content BELOW it -->
  <div class="app-main-wrapper">
    <!-- Top Navigation Header -->
    <header class="app-topbar">
      <div class="app-topbar__tabs">
        <div class="app-tab app-tab--active">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="app-tab__icon">
            <path d="M12 2L2 7L12 12L22 7L12 2Z" fill="#EE0033" stroke="#EE0033" stroke-width="1.5" stroke-linejoin="round"/>
            <path d="M2 17L12 22L22 17" stroke="#EE0033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M2 12L12 17L22 12" stroke="#EE0033" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          <span class="app-tab__text">Ứng dụng</span>
          <button type="button" class="app-tab__close" aria-label="Đóng tab">
            <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
          </button>
        </div>
      </div>

      <div class="app-topbar__right">
        <button type="button" class="app-topbar__notification" aria-label="Thông báo">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.73 21a2 2 0 0 1-3.46 0"/></svg>
          <span class="app-topbar__badge"></span>
        </button>

        <div class="app-topbar__avatar" title="Tài khoản cá nhân" (click)="logout()">
          <span class="app-topbar__avatar-letter">L</span>
          <span class="app-topbar__avatar-status"></span>
        </div>
      </div>
    </header>

    <!-- Content Area below Topbar: Submenu on the left, Main content on the right -->
    <div class="app-content-area">
      <!-- Submenu Panel ("Ứng dụng" container below topbar) -->
      <aside class="app-submenu" *ngIf="!isSidebarCollapsed">
        <h2 class="submenu-title">Ứng dụng</h2>

        <ul class="submenu-list">
          <li class="submenu-item submenu-item--active">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="submenu-icon">
              <rect x="3" y="3" width="18" height="18" rx="5" stroke="#EE0033" stroke-width="1.8"/>
              <line x1="7" y1="8" x2="13" y2="8" stroke="#EE0033" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="7" y1="12" x2="17" y2="12" stroke="#EE0033" stroke-width="1.8" stroke-linecap="round"/>
              <line x1="7" y1="16" x2="17" y2="16" stroke="#EE0033" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
            <span class="submenu-text">Danh sách ứng dụng</span>
          </li>

          <li class="submenu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D99BB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="submenu-icon">
              <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
              <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
            </svg>
            <span class="submenu-text">Danh sách yêu cầu</span>
          </li>

          <li class="submenu-item">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#8D99BB" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" class="submenu-icon">
              <rect x="2" y="3" width="20" height="14" rx="2"/>
              <path d="M7 11l3-3 4 4 3-3"/>
              <line x1="12" y1="17" x2="12" y2="21"/>
              <line x1="8" y1="21" x2="16" y2="21"/>
            </svg>
            <span class="submenu-text">Phân tích</span>
          </li>
        </ul>
      </aside>

      <!-- Main Content Container -->
      <main class="app-main" [class.app-main--create]="viewMode === 'create'">
        <!-- VIEW MODE: LIST -->
        <ng-container *ngIf="viewMode === 'list'">
          <!-- Title & Action Buttons Row -->
          <section class="main-header">
            <h1 class="main-header__title">Danh sách ứng dụng ({{ filteredApps.length }})</h1>

            <div class="main-header__actions">
              <button type="button" class="btn btn--outline-red" (click)="exportList()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>
                <span>Xuất danh sách</span>
              </button>

              <button type="button" class="btn btn--solid-red" (click)="openCreateWizard()">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" class="btn-icon"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
                <span>Thêm ứng dụng</span>
              </button>
            </div>
          </section>

          <!-- Data Table Component -->
          <app-app-table
            [applications]="pagedApps"
            [totalCount]="filteredApps.length"
            [sortColumn]="sortColumn"
            [sortDirection]="sortDirection"
            (filterChange)="onFilterChange($event)"
            (sortChange)="onSortChange($event)"
            (edit)="openEditModal($event)"
            (toggleLock)="toggleStatus($event)"
            (delete)="confirmDelete($event)"
          ></app-app-table>

          <!-- Table Pagination Component -->
          <app-pagination
            [currentPage]="currentPage"
            [pageSize]="pageSize"
            [totalItems]="filteredApps.length"
            [pageSizeOptions]="[10, 20, 50]"
            (pageChange)="onPageChange($event)"
            (pageSizeChange)="onPageSizeChange($event)"
          ></app-pagination>
        </ng-container>

        <!-- VIEW MODE: CREATE (WIZARD) -->
        <ng-container *ngIf="viewMode === 'create'">
          <app-create-app-wizard
            (complete)="onWizardComplete($event)"
            (cancel)="closeCreateWizard()"
          ></app-create-app-wizard>
        </ng-container>
      </main>
    </div>
  </div>
</div>

<!-- Modal Thêm / Chỉnh sửa Ứng dụng -->
<app-app-form-modal
  [isOpen]="isModalOpen"
  [isEditMode]="isEditMode"
  [application]="selectedApp"
  (close)="closeModal()"
  (save)="onModalSave($event)"
></app-app-form-modal>

<!-- Modal Xác nhận Xóa -->
<app-confirm-dialog
  [isOpen]="isDeleteModalOpen"
  title="Xác nhận xóa ứng dụng"
  confirmText="Xác nhận xóa"
  cancelText="Hủy"
  (confirm)="onDeleteConfirmed()"
  (cancel)="cancelDelete()"
>
  <p *ngIf="appToDelete">
    Bạn có chắc chắn muốn xóa ứng dụng <strong>"{{ appToDelete.name }}"</strong> không? Thao tác này không thể hoàn tác.
  </p>
</app-confirm-dialog>
