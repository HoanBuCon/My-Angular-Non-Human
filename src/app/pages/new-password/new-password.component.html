<main class="auth-page">
    <button id="language-button" class="language-button" type="button">
        <img class="language-button__icon" src="/assets/pages/login/dia_cau_language.svg" alt="">
        <span class="language-button__text">Tiếng Việt</span>
        <img class="language-button__arrow" src="/assets/pages/login/mui_ten_drop.svg" alt="">
    </button>

    <div class="auth-banner">
        <img class="auth-banner__image" src="/assets/pages/login/auth_banner.svg" alt="Welcome to VSS">
        <div class="auth-banner__caption">
            <h1 class="auth-banner__title">Hệ thống quản lý chat đa nền tảng</h1>
            <p class="auth-banner__description">Tiết kiệm thời gian tư vấn và chăm sóc khách hàng</p>
        </div>
        <nav class="auth-banner__pagination">
            <span class="auth-banner__dot auth-banner__dot--active"></span>
            <span class="auth-banner__dot"></span>
            <span class="auth-banner__dot"></span>
        </nav>
    </div>

    <section class="auth-page__left"></section>

    <section class="auth-page__right">
        <div class="auth-subcard">
            <header class="auth-subcard__header">
                <a routerLink="/verify-otp" class="auth-subcard__back">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><polyline points="15 18 9 12 15 6"/></svg>
                    <span>Quay lại</span>
                </a>
                <h1 class="auth-subcard__header-title">Quên mật khẩu</h1>
            </header>

            <div class="auth-subcard__body">
                <div class="auth-subcard__illustration-container">
                    <img class="auth-subcard__illustration" src="/assets/pages/new-password/new_password.svg" alt="Minh họa Mật khẩu mới">
                </div>

                <h2 class="auth-subcard__title">Tạo mật khẩu mới</h2>
                <p class="auth-subcard__description">Mật khẩu mới của bạn cần khác với mật khẩu đã sử dụng trước đó</p>

                <form [formGroup]="passwordForm" (ngSubmit)="onSubmit()" class="auth-subform" novalidate>
                    <div class="auth-subform__field">
                        <input [type]="showNewPassword ? 'text' : 'password'" id="new-password" formControlName="newPassword" class="auth-subform__input" placeholder=" ">
                        <label for="new-password" class="auth-subform__label" data-default="Nhập mật khẩu mới" data-active="Mật khẩu mới"></label>
                        <button type="button" class="auth-subform__password-toggle" (click)="toggleNewPassword()">
                            <svg *ngIf="!showNewPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg *ngIf="showNewPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                        </button>
                    </div>

                    <div class="auth-subform__field">
                        <input [type]="showConfirmPassword ? 'text' : 'password'" id="confirm-password" formControlName="confirmPassword" class="auth-subform__input" placeholder=" ">
                        <label for="confirm-password" class="auth-subform__label" data-default="Nhập lại mật khẩu mới" data-active="Nhập lại mật khẩu mới"></label>
                        <button type="button" class="auth-subform__password-toggle" (click)="toggleConfirmPassword()">
                            <svg *ngIf="!showConfirmPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><path d="M2 12s3-7 10-7 10 7 10 7-3 7-10 7-10-7-10-7Z"/><circle cx="12" cy="12" r="3"/></svg>
                            <svg *ngIf="showConfirmPassword" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="width: 20px; height: 20px;"><path d="M9.88 9.88a3 3 0 1 0 4.24 4.24"/><path d="M10.73 5.08A10.43 10.43 0 0 1 12 5c7 0 10 7 10 7a13.16 13.16 0 0 1-1.67 2.68"/><path d="M6.61 6.61A13.52 13.52 0 0 0 2 12s3 7 10 7a9.74 9.74 0 0 0 5.39-1.61"/><line x1="2" y1="2" x2="22" y2="22"/></svg>
                        </button>
                    </div>

                    <button type="submit" class="auth-subform__submit" [class.auth-subform__submit--active]="passwordForm.valid" [disabled]="passwordForm.invalid">
                        Tiếp tục
                    </button>
                </form>
            </div>
        </div>
    </section>
</main>
