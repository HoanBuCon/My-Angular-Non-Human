<div class="modal-overlay" *ngIf="isOpen" (click)="onCancel()">
  <div class="modal-card modal-card--small" (click)="$event.stopPropagation()">
    <header class="modal-card__header">
      <h2>{{ title }}</h2>
      <button type="button" class="modal-close" (click)="onCancel()" aria-label="Đóng">&times;</button>
    </header>

    <div class="modal-card__body">
      <ng-content>
        <p>{{ message }}</p>
      </ng-content>
    </div>

    <footer class="modal-card__footer">
      <button type="button" class="btn btn--secondary" (click)="onCancel()">{{ cancelText }}</button>
      <button type="button" class="btn btn--solid-red" (click)="onConfirm()">{{ confirmText }}</button>
    </footer>
  </div>
</div>
