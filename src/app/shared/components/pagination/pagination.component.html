<footer class="table-pagination">
  <div class="page-size-wrapper">
    <select
      [ngModel]="pageSize"
      (ngModelChange)="onPageSizeChange($event)"
      class="page-size-select"
      aria-label="Số bản ghi trên mỗi trang"
    >
      <option *ngFor="let size of pageSizeOptions" [value]="size">{{ size }}</option>
    </select>
    <svg class="page-size-arrow" width="10" height="7" viewBox="0 0 10 7" fill="none" xmlns="http://www.w3.org/2000/svg">
      <path d="M1 1.5L5 5.5L9 1.5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </div>

  <div class="pagination-right">
    <div class="pagination-info">
      Hiển thị từ {{ startIndex }} tới {{ endIndex }} trên {{ totalItems }} bản ghi
    </div>

    <div class="pagination-controls">
      <button
        type="button"
        class="page-btn page-btn--nav"
        (click)="prevPage()"
        [disabled]="currentPage === 1"
        title="Trang trước"
        aria-label="Trang trước"
      >
        ‹
      </button>

      <button
        *ngFor="let page of visiblePages"
        type="button"
        class="page-btn"
        [class.page-btn--active]="currentPage === page"
        (click)="goToPage(page)"
      >
        {{ page }}
      </button>

      <button
        type="button"
        class="page-btn page-btn--nav"
        (click)="nextPage()"
        [disabled]="currentPage === totalPages"
        title="Trang tiếp"
        aria-label="Trang tiếp"
      >
        ›
      </button>
    </div>
  </div>
</footer>
