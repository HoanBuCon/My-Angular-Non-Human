<div class="table-actions-group">
  <!-- 1. Edit Button -->
  <button
    *ngIf="showEdit"
    type="button"
    class="action-btn action-btn--edit"
    (click)="onEdit($event)"
    [nz-tooltip]="editTooltip"
    [title]="editTooltip"
    aria-label="Chỉnh sửa"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <path d="M17 3a2.828 2.828 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5L17 3z"/>
    </svg>
  </button>

  <!-- 2. Lock / Unlock Button -->
  <button
    *ngIf="showLock"
    type="button"
    class="action-btn action-btn--lock"
    [class.action-btn--locked]="isCurrentlyLocked"
    (click)="onToggleLock($event)"
    [nz-tooltip]="isCurrentlyLocked ? unlockTooltip : lockTooltip"
    [title]="isCurrentlyLocked ? unlockTooltip : lockTooltip"
    [attr.aria-label]="isCurrentlyLocked ? unlockTooltip : lockTooltip"
  >
    <!-- Open / In-use State (Click to lock) -->
    <svg *ngIf="!isCurrentlyLocked" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
    </svg>
    <!-- Locked State (Click to unlock) -->
    <svg *ngIf="isCurrentlyLocked" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
      <path d="M7 11V7a5 5 0 0 1 9.9-1"/>
    </svg>
  </button>

  <!-- 3. Delete Button -->
  <button
    *ngIf="showDelete"
    type="button"
    class="action-btn action-btn--delete"
    (click)="onDelete($event)"
    [nz-tooltip]="deleteTooltip"
    [title]="deleteTooltip"
    aria-label="Xóa"
  >
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="3 6 5 6 21 6"/>
      <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/>
      <line x1="10" y1="11" x2="10" y2="17"/>
      <line x1="14" y1="11" x2="14" y2="17"/>
    </svg>
  </button>
</div>
